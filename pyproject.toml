[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "camcat"
version = "0.1.0"
description = "Multimodal intelligent video editing harness"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "boto3>=1.39,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jsonpatch>=1.33,<2",
  "langgraph>=0.6,<2",
  "markdown-it-py>=4,<5",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "pymilvus>=2.6,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0.41,<3",
  "scipy>=1.16,<1.17",
  "Pillow==12.0.0",
  "uniseg==0.10.1",
  "opencv-python-headless==4.11.0.86",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
tts = ["piper-tts==1.3.0"]
dev = [
  "OpenCC==1.1.9",
  "sacrebleu==2.5.1",
  "jiwer==4.0.0",
  "pysubs2==1.8.0",
  "jsonschema==4.25.1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "tests/integration"]
pythonpath = ["apps/api", "."]
asyncio_default_fixture_loop_scope = "function"
markers = [
  "external: requires real configured external model services",
  "integration: requires Docker Compose infrastructure",
]

[tool.setuptools.packages.find]
where = ["apps/api"]
include = ["camcat*"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["third_party"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["camcat"]
mypy_path = "apps/api"
ignore_missing_imports = true

# OpenCV's 4.11 stubs reject the documented None output buffers used by LK.
# Keep native bindings opaque; real source-frame tests exercise this boundary.
[[tool.mypy.overrides]]
module = ["cv2", "cv2.*"]
follow_imports = "skip"
